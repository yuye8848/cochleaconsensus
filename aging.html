<h1 data-en="Aging (descriptive)" data-zh="老化层（描述性）"></h1>

<p class="warn" data-en="This layer is DESCRIPTIVE ONLY. A full audit of all 25 aging-related series in the census found the public pool exhausted and the 5 comparable designs mutually heterogeneous (NAD+ intervention, miR-29a knockout progeria, polG mutator, exercise intervention, screening array) — they are not the same 'aging'. Cross-study consensus is effectively absent (a single gene, Ch25h) and ortholog concordance is absent (0.475). No aging consensus signature is claimed; that negative result is itself reported as a finding."
data-zh="本层仅作描述性报告。对普查中全部 25 个老化相关系列的审计显示：公开数据池已见底，仅有的 5 个 comparable 设计彼此异质（NAD+ 干预、miR-29a 敲除早衰、polG 突变、运动干预、筛选芯片）——不是同一种「老化」。跨研究共识实际缺失（仅 1 个基因 Ch25h），同源一致性亦缺失（0.475）。本资源不主张任何老化共识签名；这个阴性结果本身作为发现报告。"></p>
