<h1 data-en="Analyze" data-zh="查"></h1>

<h2 data-en="1 · Test your gene list against the consensus" data-zh="1 · 用你的基因列表对照共识"></h2>
<p data-en="Paste gene symbols (one per line or comma-separated). Overlap with each layer's consensus set and the mouse–fish concordant lists is computed in your browser with a hypergeometric test; nothing is uploaded."
data-zh="粘贴基因符号（一行一个或逗号分隔）。与每层共识集及鼠↔鱼同向名单的重叠在浏览器内以超几何检验计算，不上传任何数据。"></p>
<textarea id="a-up" rows="7" placeholder="Up genes, e.g. Atoh1"></textarea>
<textarea id="a-down" rows="7" placeholder="Down genes, e.g. Fos"></textarea>
<button id="a-run" data-en="Run overlap test" data-zh="运行重叠检验"></button>
<table class="t" id="a-out"></table>
<h2 data-en="2 · Single-gene lookup" data-zh="2 · 单基因查询"></h2>
<p data-en="One gene across all 77 bulk contrasts and 58 cell-type or lower-resolution DE tables (records with FDR &lt; 0.05 or |logFC| ≥ 0.5)."
data-zh="查一个基因在全部 77 个 bulk 对比与 58 张细胞类型或更低分辨率 DE 表中的记录（FDR &lt; 0.05 或 |logFC| ≥ 0.5 的记录）。"></p>
<input id="g-q" type="text" placeholder="Gene symbol, e.g. Atoh1"> <button id="g-run" data-en="Look up" data-zh="查询"></button>
