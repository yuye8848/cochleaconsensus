<h1 data-en="Cohorts" data-zh="队列策展表"></h1>

<p data-en="The curated core comprises 88 mouse series (2,242 samples) plus a 10-series zebrafish regeneration module (176 samples; 98 series, 2,418 samples in total). Sample-level adjudication found that three genetic-layer series (GSE40207, GSE172286, GSE111668) contain no inner-ear samples; these are retained in the curation table, flagged as unusable, and excluded from all reanalysis."
data-zh="核心策展集为小鼠 88 个系列 / 2,242 个样本，另有斑马鱼再生模块 10 系列 / 176 样本，核心合计 98 系列 / 2,418 样本。样本级核验发现其中 3 个遗传层系列（GSE40207、GSE172286、GSE111668）实际不含内耳样本，已裁定不可用，保留在策展表中点名标注、不进入任何重分析。"></p>
