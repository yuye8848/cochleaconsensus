<h1 data-en="Consensus" data-zh="跨研究共识"></h1>

<p data-en="Per-insult cross-study consensus: genes significant in the same direction in ≥2 independent studies (grades strong + consensus). Mouse layers dominate the picture with layer-specific responses — the cross-insult core shared by ≥3 mouse layers contains only 10 same-direction genes (up: Gdf15, Myh9)."
