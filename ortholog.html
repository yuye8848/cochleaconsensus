<h1 data-en="Ortholog contrast" data-zh="鼠↔鱼同源对比"></h1>

<p data-en="Formal mouse–zebrafish contrast: within-study Stouffer merging (handling shared controls and time series), 7,983 1:1 ortholog pairs, direction concordance with binomial / Spearman / Fisher tests and a 5,000-permutation homolog null. Concordance is strongest for regeneration, present for genetic and noise layers, absent for ototoxicity and aging."
data-zh="鼠↔鱼正式对比：研究内 Stouffer 合并（处理共享对照与时间序列），7,983 对 1:1 同源基因，方向一致性配二项/Spearman/Fisher 检验与 5,000 次同源置换零分布。再层一致性最强，遗传与噪声层存在，耳毒与老化层缺失。"></p>
<table class="t" id="ortho-table"></table>

<p data-en="Anchor: Atoh1 → atoh1a is bilateral-strong and same-direction in the REGEN layer. In the GENETIC layer the pair is likewise same-direction (up in both species), but the mouse side does not reach the strong threshold (z = 2.11), so the pair is not bilateral-strong there. Note that the enhancer basis of this locus has been characterised across species by Shi et al. (PNAS 2024, PMID 39671177), who compared the Atoh1 enhancer landscape in regenerative vertebrates (zebrafish and green anole) with mouse and showed, by enhancer deletion in zebrafish, that long-range Atoh1 enhancers maintain competency for hair cell regeneration; the transcriptome-wide concordance test here is the new layer."
data-zh="锚点：Atoh1 → atoh1a 在再生层为双侧 strong 且同向。在遗传层该基因对同样同向（两物种均为上调），但小鼠侧未达 strong 阈值（z = 2.11），故在该层不构成双侧 strong。注：该位点的增强子基础已由 Shi et al.（PNAS 2024，PMID 39671177）作跨物种刻画：该研究比较了再生型脊椎动物（斑马鱼与绿安乐蜥）与小鼠的 Atoh1 增强子景观，并在斑马鱼中通过增强子缺失实验表明，长程 Atoh1 增强子维持毛细胞再生胜任力；本资源的新层是全转录组级的一致性检验。"></p>
