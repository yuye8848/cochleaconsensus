<h1 data-en="Pathways" data-zh="通路与 TF 富集"></h1>

<p data-en="Over-representation enrichment (GO / KEGG / Reactome) of the cross-study consensus gene sets, split by direction, against layer-specific tested-gene backgrounds — never the whole genome. 2,838 terms pass q &lt; 0.05 across 20 sets. The AGING bulk layer was not enriched (only 1 consensus gene)."
data-zh="对跨研究共识基因集按方向分开做的过表征富集（GO / KEGG / Reactome），背景为该层实际检验基因集、非全基因组。20 个基因集共 2,838 条通路过 q &lt; 0.05。老化 bulk 层未做富集（共识仅 1 个基因）。"></p>
<p class="warn" data-en="Interpretation boundary: the mouse REGEN consensus is dominated by one reprogramming study (GSE161156) and partly reflects supporting-cell to hair-cell-like identity conversion; its enrichment results carry the same caveat and must not be read as a pure regeneration program. The REGEN down set returned no significant term in any database."
data-zh="解释边界：小鼠再生层共识被一个重编程研究（GSE161156）主导，部分反映支持细胞→毛细胞样身份转换；其富集结果带同一限定，不得直读为纯粹再生程序。再生下调集在所有数据库中无显著通路。"></p>
