<h1 data-en="Single-cell" data-zh="单细胞层"></h1>

<p data-en="22 single-cell / spatial series processed under one pipeline; 17 cell-level series totalling 624,714 cells after QC. All inference uses donor/library as the replicate unit (pseudobulk), never cells. 58 cell-type-level DE tables were produced (DESeq2 54, limma 4)."
data-zh="22 个单细胞/空间系列统一管线处理；17 个细胞级系列 QC 后合计 624,714 个细胞。全部推断以供体/文库为重复单位（pseudobulk），从不以细胞为重复。共产出 58 张细胞型水平 DE 表（DESeq2 54、limma 4）。"></p>
<p class="warn" data-en="Flagged: GSE291228 P4 endolymphatic-sac-type DE shows an anomalously large FDR-gene count under a 2v2 low-replication design (possible batch confounding); it is delivered as-is and must not be interpreted biologically."
data-zh="点名警示：GSE291228 P4 内淋巴囊型 DE 在 2v2 低重复设计下 FDR 基因数异常大（可能批次混杂），按原样交付、不得作生物学解释。"></p>
<div class="filters"><label>Series <select id="s-series"><option value="">All</option></select></label><span id="s-count"></span></div>

<h2 data-en="Measured immune composition (no deconvolution)" data-zh="免疫成分实测（不做反卷积）"></h2>
<p data-en="Immune-cell fractions below are measured directly from the cell-level data. No bulk deconvolution (CIBERSORT/ssGSEA-style inference) is performed anywhere in this resource. Most series are n=1/arm or low-replication, so group differences are descriptive."
data-zh="下表免疫细胞占比直接由细胞级数据实测。本资源任何地方都不做 bulk 反卷积（CIBERSORT/ssGSEA 类推断）。多数系列为 n=1/臂或低重复，组间差异均为描述性。"></p>
